<svg xmlns="http://www.w3.org/2000/svg" width="140" height="30" viewBox="0 0 140 30">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#688CCF"/>
      <stop offset="100%" stop-color="#2C4778"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill">
      <rect width="140" height="30" rx="15"/>
    </clipPath>
    <style>
      .label { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0.3px; }
      .halo  { transform-box: fill-box; transform-origin: center; animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
      .shine { animation: sweep 4s ease-in-out 1s infinite; }
      .arrow { animation: nudge 4s ease-in-out 1s infinite; }
      @keyframes ping  { 0% { transform: scale(1); opacity: .7; } 80%,100% { transform: scale(2.6); opacity: 0; } }
      @keyframes sweep { 0% { transform: translateX(0); } 30%,100% { transform: translateX(240px); } }
      @keyframes nudge { 0%,20%,100% { transform: translateX(0); } 10% { transform: translateX(2px); } }
    </style>
  </defs>

  <g clip-path="url(#pill)">
    <rect width="140" height="30" fill="url(#bg)"/>
    <rect width="140" height="15" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect class="shine" x="-60" y="0" width="50" height="30" fill="url(#shine)"/>
  </g>

  <circle class="halo" cx="18" cy="15" r="4" fill="#FFFFFF"/>
  <circle cx="18" cy="15" r="4" fill="#FFFFFF"/>

  <text class="label" x="31" y="19.5">In progress</text>
  <g class="arrow">
    <path d="M110 15h12M117 10l5 5-5 5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
