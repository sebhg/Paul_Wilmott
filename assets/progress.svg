<svg xmlns="http://www.w3.org/2000/svg" width="360" height="20" viewBox="0 0 360 20">
  <!--
    Pour mettre à jour : change PERCENT ci-dessous à deux endroits
    - width de la barre verte = 240 × PERCENT / 100  (ex : 10 % → 24)
    - le texte à droite
  -->
  <style>
    .label { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 0.6px; }
    .fill  { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) 0.2s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <text class="label" x="0" y="14">PROGRESS</text>
  <rect x="76" y="7" width="240" height="6" rx="3" fill="#8b949e" fill-opacity="0.25"/>
  <rect class="fill" x="76" y="7" width="24" height="6" rx="3" fill="#2ea44f"/>
  <text class="label" x="360" y="14" text-anchor="end">10%</text>
</svg>
