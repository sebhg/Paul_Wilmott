<svg xmlns="http://www.w3.org/2000/svg" width="170" height="20" viewBox="0 0 170 20">
  <defs>
    <linearGradient id="seg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#008080" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#008080" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#47A141" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7BD389" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track">
      <rect x="0" y="7" width="170" height="6" rx="3"/>
    </clipPath>
    <style>
      .a { animation: slide 2.2s cubic-bezier(.65,0,.35,1) infinite; }
      .b { animation: slide 2.2s cubic-bezier(.65,0,.35,1) 1.1s infinite; opacity: .45; }
      @keyframes slide {
        from { transform: translateX(0); }
        to   { transform: translateX(260px); }
      }
    </style>
  </defs>

  <rect x="0" y="7" width="170" height="6" rx="3" fill="#8b949e" fill-opacity="0.2"/>
  <g clip-path="url(#track)">
    <rect class="a" x="-90" y="7" width="90" height="6" fill="url(#seg)"/>
    <rect class="b" x="-90" y="7" width="90" height="6" fill="url(#seg)"/>
  </g>
</svg>
